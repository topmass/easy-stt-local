[project]
name = "recordtranscribe"
version = "0.2.0"
description = "Voice recording and transcription with NeMo ASR - GPU accelerated"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.8.1",
    "pyperclip>=1.9.0",
    "sounddevice>=0.5.2",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
    "nemo-toolkit[asr]>=2.0.0",
    "ml-dtypes>=0.5.0",
    "cuda-python>=12.3,<13.0",
]
